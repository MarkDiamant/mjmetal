name: Verify BMS core parity
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shared core against Diamant Solutions master
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/MarkDiamant/diamant-solutions/main/business-software-core"
          files=(
            "components/admin/AdminBrandBar.tsx"
            "components/admin/CrmDashboardV3.tsx"
            "components/admin/CrmDashboardV4.tsx"
            "components/admin/CrmDashboardV5.tsx"
            "components/admin/JobDetail.tsx"
            "components/admin/JobWorkflowPanel.tsx"
            "components/admin/NewJobForm.tsx"
            "components/admin/NewJobFormV2.tsx"
            "components/admin/QuotePdfActions.tsx"
            "components/admin/QuotePrint.tsx"
            "components/admin/SetupRequired.tsx"
            "components/admin/XeroInvoicePage.tsx"
            "lib/permissions.ts"
            "lib/product.ts"
          )
          failed=0
          for rel in "${files[@]}"; do
            if [[ "$rel" == lib/* ]]; then local_path="lib/crm/${rel#lib/}"; else local_path="$rel"; fi
            curl -fsSL "$base/$rel" -o /tmp/master-file
            if ! cmp -s /tmp/master-file "$local_path"; then
              echo "::error file=$local_path::Shared BMS core differs from Diamant Solutions master ($rel). Make shared changes in diamant-solutions first, then sync M&J."
              failed=1
            fi
          done
          exit "$failed"
