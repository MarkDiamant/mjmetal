name: Sync BMS shared core
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: bms-core-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy only approved shared BMS components
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/MarkDiamant/diamant-solutions/main/business-software-core"
          files=(
            "components/admin/AdminBrandBar.tsx"
            "components/admin/CrmDashboardV3.tsx"
            "components/admin/CrmDashboardV4.tsx"
            "components/admin/CrmDashboardV5.tsx"
            "components/admin/JobDetail.tsx"
            "components/admin/JobWorkflowPanel.tsx"
            "components/admin/NewJobForm.tsx"
            "components/admin/NewJobFormV2.tsx"
            "components/admin/QuotePdfActions.tsx"
            "components/admin/QuotePrint.tsx"
            "components/admin/SetupRequired.tsx"
            "components/admin/XeroInvoicePage.tsx"
            "lib/permissions.ts"
            "lib/product.ts"
          )
          for rel in "${files[@]}"; do
            if [[ "$rel" == lib/* ]]; then dest="lib/crm/${rel#lib/}"; else dest="$rel"; fi
            curl --fail --silent --show-error --location --retry 3 "$base/$rel?run=${GITHUB_RUN_ID}" -o "$dest"
          done
          git diff --check
      - name: Open or update core sync pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Sync shared BMS core from Diamant Solutions"
          branch: automation/bms-core-sync
          delete-branch: true
          title: "Sync approved shared BMS core from Diamant Solutions"
          body: |
            Automated sync of allowlisted shared BMS UI and product logic only.
            No M&J customer data, settings, branding, database, integrations or secrets are touched.
            Review and merge after checks pass. No automatic production deployment until this safety gate is approved.
          add-paths: |
            components/admin/
            lib/crm/permissions.ts
            lib/crm/product.ts
