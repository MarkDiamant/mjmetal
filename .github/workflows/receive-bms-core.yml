name: Receive shared BMS core updates
on:
  repository_dispatch:
    types: [bms-core-updated]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bms-core-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BMS_TENANT_SYNC_TOKEN || github.token }}
      - name: Fetch canonical core
        env:
          GH_TOKEN: ${{ secrets.BMS_TENANT_SYNC_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "::error::BMS_TENANT_SYNC_TOKEN is not configured"; exit 1; }
          rm -rf .bms-core
          mkdir .bms-core
          gh api repos/MarkDiamant/diamant-solutions/tarball/main > /tmp/core.tar.gz
          tar -xzf /tmp/core.tar.gz -C .bms-core --strip-components=1
      - name: Sync canonical components
        run: |
          rsync -a --delete .bms-core/business-software-core/components/admin/ components/admin/
          rm -rf .bms-core
      - name: Commit and push
        run: |
          git config user.name "BMS Core Sync"
          git config user.email "actions@users.noreply.github.com"
          git add components/admin
          if git diff --cached --quiet; then
            echo "Already current"
            exit 0
          fi
          git commit -m "Sync shared BMS core from Diamant Solutions"
          git push origin HEAD:main
